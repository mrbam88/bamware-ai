<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Bamware Assistant</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="app" id="app" data-view="loading">
    <header class="top">
      <div class="brand">
        <span class="dot" id="statusDot" aria-hidden="true"></span>
        <h1>Bamware Assistant</h1>
      </div>
      <div class="status" id="statusText" role="status" aria-live="polite">Checking…</div>
    </header>

    <nav class="tabs" id="tabs" hidden>
      <button type="button" class="tab" id="tabChat" data-tab="chat">Chat</button>
      <button type="button" class="tab" id="tabAgents" data-tab="agents">Agents</button>
    </nav>

    <!-- Login -->
    <section class="view login" id="loginView" hidden>
      <form id="loginForm" autocomplete="off">
        <label for="password">Owner password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" />
        <button type="submit" class="primary">Sign in</button>
        <p class="hint" id="loginHint" aria-live="polite"></p>
      </form>
    </section>

    <!-- Chat -->
    <section class="view chat" id="chatView" hidden>
      <ol class="transcript" id="transcript" aria-label="Conversation"></ol>

      <div class="voiceBar" id="voiceBar" hidden>
        <span class="voiceState" id="voiceState">Listening…</span>
        <span class="interim" id="interim"></span>
      </div>

      <form class="composer" id="composer">
        <button type="button" class="icon" id="micBtn" aria-pressed="false" title="Hold a conversation by voice">🎙️</button>
        <textarea id="text" rows="1" placeholder="Ask the assistant…" maxlength="4000" required></textarea>
        <button type="submit" class="primary" id="sendBtn">Send</button>
        <button type="button" class="icon" id="stopBtn" hidden title="Stop speaking">⏹</button>
      </form>

      <footer class="meta">
        <span id="sessionLabel">New conversation</span>
        <span class="sep">·</span>
        <button type="button" class="link" id="newBtn">New</button>
        <button type="button" class="link" id="exportBtn" disabled>Export</button>
        <button type="button" class="link danger" id="deleteBtn" disabled>Delete</button>
        <span class="sep">·</span>
        <span id="traceLabel" title="Langfuse groups traces by this Hermes session id"></span>
        <span class="grow"></span>
        <label class="toggle"><input type="checkbox" id="speakToggle" /> Speak replies</label>
        <button type="button" class="link" id="logoutBtn">Sign out</button>
      </footer>
    </section>

    <!-- Agents -->
    <section class="view agents" id="agentsView" hidden>
      <div class="widget" id="rateLimitsWidget">
        <div class="widgetHead">
          <h2>Rate limits &amp; resets</h2>
          <div class="widgetActions">
            <span class="hint" id="rateLimitsGenerated"></span>
            <label class="toggle" title="Load synthetic fixture data to preview every state; never real usage">
              <input type="checkbox" id="rateLimitsDemoToggle" /> Preview demo data
            </label>
            <button type="button" class="link" id="rateLimitsRefresh">Refresh</button>
          </div>
        </div>
        <p class="demoBanner" id="rateLimitsDemoBanner" hidden>
          ⚠ Synthetic demo data for preview only — not a real provider reading.
        </p>
        <ul class="rateLimitList" id="rateLimitList" aria-live="polite"></ul>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
