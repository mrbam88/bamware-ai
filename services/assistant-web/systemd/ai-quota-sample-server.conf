# Reuse the existing ten-minute quota timer; do not create a duplicate scheduler.
# Runs first so a later Claude/DynamoDB ingestion failure cannot block OpenAI
# collection. A failed local collector also must not block the Claude feed.
[Service]
ExecStartPre=-/usr/bin/python3 %h/srv/bamware-ai/services/assistant-web/scripts/collect-server-quota.py
