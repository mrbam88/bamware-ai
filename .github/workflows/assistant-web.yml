name: assistant-web

# Command Center is CEO-facing. Unit tests always run; browser fixtures when
# Chromium is available. A green main without these is how Confirm-stuck shipped.

on:
  push:
    branches: [main]
    paths:
      - 'services/assistant-web/**'
      - '.github/workflows/assistant-web.yml'
  pull_request:
    paths:
      - 'services/assistant-web/**'
      - '.github/workflows/assistant-web.yml'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test

  browser-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Action feedback fixtures
        env:
          PLAYWRIGHT_MODULE: playwright
        run: |
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          CHROMIUM_BIN="$CHROME" node scripts/verify-action-feedback.mjs
      - name: Status / history fixtures
        env:
          PLAYWRIGHT_MODULE: playwright
        run: |
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          CHROMIUM_BIN="$CHROME" node scripts/verify-cc-status.mjs
