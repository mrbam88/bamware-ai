name: discord-router

on:
  push:
    branches: [main]
    paths:
      - 'services/discord-router/**'
      - 'config/model-routing.yaml'
      - '.github/workflows/discord-router.yml'
  pull_request:
    paths:
      - 'services/discord-router/**'
      - 'config/model-routing.yaml'
      - '.github/workflows/discord-router.yml'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discord-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
