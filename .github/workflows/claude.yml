# Mention @claude in an issue or PR comment and Claude Code runs here, on a
# GitHub-hosted runner, and pushes a branch.
#
# Requires: the Claude GitHub App installed on this repo, and a
# CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).
#
# WARNING: this repo is PUBLIC. Never commit a credential value or PII.
# See docs/security.md.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
